<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52945F"/>
      <stop offset="100%" stop-color="#2E6039"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Card shadow -->
  <rect x="11" y="11" width="44" height="46" rx="5" ry="5" fill="rgba(20,50,25,0.22)"/>
  <!-- Card body -->
  <rect x="9" y="9" width="44" height="46" rx="5" ry="5" fill="white"/>
  <!-- Header -->
  <rect x="9" y="9" width="44" height="14" rx="5" ry="5" fill="#346840"/>
  <rect x="9" y="17" width="44" height="6" fill="#346840"/>
  <!-- Header label pill -->
  <rect x="20" y="13" width="22" height="4" rx="2" ry="2" fill="rgba(255,255,255,0.5)"/>
  <!-- Binding tabs -->
  <circle cx="22" cy="9" r="3" fill="rgba(255,255,255,0.85)"/>
  <circle cx="40" cy="9" r="3" fill="rgba(255,255,255,0.85)"/>
  <!-- Event bar 1: green + checkmark -->
  <rect x="13" y="30" width="36" height="5" rx="2.5" fill="#4B8C58"/>
  <polyline points="15.5,32.5 18,35.2 22.5,29.5" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="25" y="31.5" width="21" height="2" rx="1" fill="rgba(255,255,255,0.65)"/>
  <!-- Event bar 2 -->
  <rect x="13" y="39" width="25" height="4" rx="2" fill="#B9E1C3"/>
  <!-- Event bar 3 -->
  <rect x="13" y="47" width="17" height="4" rx="2" fill="#D7EFDF"/>
</svg>